<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book pickup · Loopo</title><meta name="description" content="Loopo – book doorstep scrap pickup with fair rates, accurate weighing and instant payment."><link rel="stylesheet" href="style.css"></head><body data-p="book" data-r=""><header></header><main class="w"><section><h2>Book a pickup</h2><form id="bf"><label>Name<input name="name" required></label><label>Phone<input name="phone" type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required></label><label>Address<textarea name="address" rows="2" required></textarea></label><div><b style="font-size:14px">Scrap types</b><div class="chk" id="cats"></div></div><label>Approx. weight (kg)<input name="kg" type="number" min="1"></label><label>Date<input name="date" id="dt" type="date" required></label><label>Time slot<select name="slot"><option>9 am – 11 am</option><option>11 am – 1 pm</option><option>2 pm – 4 pm</option><option>4 pm – 6 pm</option></select></label><button class="btn l">Confirm booking</button></form><div id="done" class="c" hidden><h3 class="ok">Booked ✓</h3><p>Your booking ID is <b id="bid"></b>. Use it on the <a href="track.html">Track</a> page.</p></div></section></main><footer></footer><script src="app.js" defer></script></body></html>
